name: Upload Python Package to PyPI (Trusted Publishing)

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build --no-sources

      - name: Verify package artifacts
        run: |
          test -f dist/depcycle-*.whl
          test -f dist/depcycle-*.tar.gz
          ls -lh dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
