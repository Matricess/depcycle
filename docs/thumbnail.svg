<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928" viewBox="0 0 1648 928" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">DepCycle — See how your Python modules connect</title>
  <desc id="desc">A cream and navy vector thumbnail showing DepCycle branding, dependency graph and circular import detection features, and a sample Python module dependency graph with a highlighted circular import.</desc>
  <defs>
    <!-- refX = 9 so the arrow tip lands exactly on the line end -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#637d98"/>
    </marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#fb5c56"/>
    </marker>
    <style>
      .node-title{font-family:Inter,Arial,sans-serif;font-weight:650;font-size:21px;fill:#192b45}
      .node-path{font-family:Inter,Arial,sans-serif;font-weight:400;font-size:15px;fill:#6d819b}
      .feature-title{font-family:Inter,Arial,sans-serif;font-size:21px;fill:#192b45;font-weight:500}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1648" height="928" fill="#fbfaf6"/>

  <!-- Brand mark: two symmetric circular arrows (second is the first rotated 180°) -->
  <g transform="translate(140 199)">
    <g fill="#192b45" stroke="#192b45">
      <path d="M-47 -17.1 A50 50 0 0 1 47 -17.1" fill="none" stroke-width="20"/>
      <path d="M54.5 3.6 L67.7 -24.6 L26.3 -9.6 Z" stroke="none"/>
    </g>
    <g transform="rotate(180)" fill="#3eb69e" stroke="#3eb69e">
      <path d="M-47 -17.1 A50 50 0 0 1 47 -17.1" fill="none" stroke-width="20"/>
      <path d="M54.5 3.6 L67.7 -24.6 L26.3 -9.6 Z" stroke="none"/>
    </g>
  </g>
  <text x="232" y="232" font-family="Inter,Arial,sans-serif" font-size="91" font-weight="750" letter-spacing="-3.2" fill="#192b45">DepCycle</text>

  <!-- Headline (single text element, so "connect." follows automatically) -->
  <text x="72" y="388" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="400" letter-spacing="-2.5" fill="#192b45">See how your</text>
  <text x="72" y="468" font-family="Inter,Arial,sans-serif" font-size="68" letter-spacing="-2.5"><tspan font-weight="750" fill="#244c94">Python modules </tspan><tspan font-weight="650" fill="#192b45">connect.</tspan></text>
  <text x="72" y="550" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="400" letter-spacing="-0.6" fill="#6f8299">Map dependencies. Spot circular imports.</text>

  <!-- Feature columns: x = 72 / 288 / 538, dividers at 240 / 490 -->
  <!-- Feature 1: dependency graph -->
  <g transform="translate(75 647)" stroke="#192b45" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 34 L29 6 L54 24 L31 48 Z"/>
    <circle cx="4" cy="34" r="7" fill="#fbfaf6"/>
    <circle cx="29" cy="6" r="7" fill="#fbfaf6"/>
    <circle cx="54" cy="24" r="7" fill="#fbfaf6"/>
    <circle cx="31" cy="48" r="7" fill="#fbfaf6"/>
  </g>
  <text class="feature-title" x="72" y="744">Dependency</text>
  <text class="feature-title" x="72" y="773">Graph</text>

  <path d="M240 636 V790" stroke="#cbd2d8" stroke-width="1.6"/>

  <!-- Feature 2: circular import detection (same arrow geometry as the brand mark, in coral) -->
  <g transform="translate(318 676) scale(0.42)">
    <g fill="#fb5c56" stroke="#fb5c56">
      <path d="M-47 -17.1 A50 50 0 0 1 47 -17.1" fill="none" stroke-width="20"/>
      <path d="M54.5 3.6 L67.7 -24.6 L26.3 -9.6 Z" stroke="none"/>
    </g>
    <g transform="rotate(180)" fill="#fb5c56" stroke="#fb5c56">
      <path d="M-47 -17.1 A50 50 0 0 1 47 -17.1" fill="none" stroke-width="20"/>
      <path d="M54.5 3.6 L67.7 -24.6 L26.3 -9.6 Z" stroke="none"/>
    </g>
  </g>
  <text class="feature-title" x="288" y="744">Circular Import</text>
  <text class="feature-title" x="288" y="773">Detection</text>

  <path d="M490 636 V790" stroke="#cbd2d8" stroke-width="1.6"/>

  <!-- Feature 3: output formats -->
  <g transform="translate(535 646)" fill="none" stroke="#192b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 0 H39 L51 12 V49 Q51 57 44 57 H10 Q3 57 3 50 V8 Q3 0 10 0 Z"/>
    <path d="M39 1 V13 H50"/>
    <path d="M16 29 L10 35 L16 41 M28 29 L34 35 L28 41 M24 27 L20 44"/>
  </g>
  <text class="feature-title" x="538" y="744">Multiple</text>
  <text class="feature-title" x="538" y="773">Output Formats</text>
  <text x="538" y="803" font-family="Inter,Arial,sans-serif" font-size="18" fill="#8294a8">HTML  ·  JSON  ·  DOT</text>

  
  <defs>
    <clipPath id="reportClip">
      <rect x="883" y="177" width="700" height="438" rx="12"/>
    </clipPath>
  </defs>
  <rect x="880" y="174" width="706" height="444" rx="16" fill="#fbfaf6" stroke="#d7dce0" stroke-width="1.7"/>
  <image
    href="https://raw.githubusercontent.com/Matricess/depcycle/main/docs/generated/cyclic_app_html_screenshot.png"
    x="883" y="177" width="700" height="438"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#reportClip)"
  />
</svg>
